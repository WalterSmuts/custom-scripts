# DavMail gateway config for M365 (mode O365Manual: we supply the refresh
# token ourselves). Copy to ~/.davmail.properties, then run davmail-refresh
# once to append the davmail.oauth.<user>.refreshToken line.

davmail.mode=O365Manual
davmail.url=https://outlook.office365.com/EWS/Exchange.asmx
davmail.oauth.clientId=d3590ed6-52b3-4102-aeff-aad2292ab01c
davmail.oauth.redirectUri=urn:ietf:wg:oauth:2.0:oob
davmail.caldavPort=1080
davmail.imapPort=1143
davmail.ldapPort=1389
davmail.popPort=1110
davmail.smtpPort=1025
davmail.smtpSaveInSent=true
davmail.enableEws=true
davmail.ssl.nosecurecaldav=false
davmail.ssl.nosecureimap=false
davmail.ssl.nosecureldap=false
davmail.ssl.nosecurepop=false
davmail.ssl.nosecuresmtp=false
davmail.defaultDomain=amazon.com
davmail.showStartupBanner=true
davmail.logFilePath=__HOME__/.davmail/davmail.log
davmail.logFileSize=1MB
log4j.rootLogger=WARN
log4j.logger.davmail=DEBUG
davmail.server=true
davmail.caldavAlwaysMimeContent=false
